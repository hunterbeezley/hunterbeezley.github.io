<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume - Hunter Beezley</title>

    <meta name="description" content="Resume of Hunter Beezley - Technology Experience & Domain Specialist, IAM Lead, and GenAI Systems Builder">
    <meta name="author" content="Hunter Beezley">

    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0d1117">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <link rel="stylesheet" href="/vault.css">

    <style>
        .resume-header {
            text-align: center;
        }

        .download-btn {
            display: inline-block;
            padding: 1rem 2rem;
            background: var(--accent);
            color: var(--bg);
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .download-btn:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="vault-layout">
        <div id="vault-sidebar"></div>

        <main class="vault-content">
            <button class="vault-mobile-toggle" aria-label="Toggle sidebar"></button>

            <div class="resume-header" style="padding: 6rem 0;">
                <button onclick="openResumeModal()" class="download-btn">Request Resume</button>
            </div>

            <footer class="vault-footer">
                <p>&copy; 2026 Hunter Beezley. Built with care and code.</p>
            </footer>
        </main>
    </div>

    <!-- Resume Request Modal -->
    <div id="resumeModal" class="resume-modal">
        <div class="resume-modal-content">
            <h2>Request Resume</h2>
            <p>I'd like to know a bit more about you before sharing my resume. Please fill out the form below.</p>
            <form class="resume-modal-form" id="resumeForm">
                <input type="text" name="name" placeholder="Your name" required>
                <input type="email" name="email" placeholder="Your email" required>
                <textarea name="message" placeholder="What's your interest? (optional)"></textarea>
                <div class="resume-modal-buttons">
                    <button type="submit" class="submit-btn">Send Request</button>
                    <button type="button" class="cancel-btn" onclick="document.getElementById('resumeModal').classList.remove('open')">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <a href="admin.html" class="vault-admin-link" aria-label="Admin" title="Admin" style="font-weight: 600; font-size: 0.85rem;">ADM</a>

    <script src="/pwa-register.js"></script>
    <script src="/vault-sidebar.js"></script>
    <script>
        function openResumeModal() {
            document.getElementById('resumeModal').classList.add('open');
        }

        document.getElementById('resumeForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = this.elements.name.value;
            const email = this.elements.email.value;
            const message = this.elements.message.value;

            const body = `Name: ${name}\nEmail: ${email}\n\n${message ? 'Message: ' + message : ''}`;
            window.location.href = `mailto:nikkimargarita@proton.me?subject=Resume Request from ${encodeURIComponent(name)}&body=${encodeURIComponent(body)}`;

            document.getElementById('resumeModal').classList.remove('open');
            this.reset();
        });

        window.addEventListener('click', function(e) {
            const modal = document.getElementById('resumeModal');
            if (e.target === modal) {
                modal.classList.remove('open');
            }
        });
    </script>
</body>
</html>
